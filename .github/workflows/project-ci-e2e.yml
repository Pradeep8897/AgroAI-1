name: Project CI with Selenium and Appium

on:
  push:
    branches:
      - main
      - 'feature/**'
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  selenium-e2e:
    name: Selenium E2E Report
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '20'
      - name: Install backend requirements
        run: |
          python -m pip install --upgrade pip
          if [ -f backend/requirements.txt ]; then pip install -r backend/requirements.txt; fi
      - name: Install frontend dependencies
        working-directory: frontend
        run: npm install
      - name: Install Selenium dependencies
        working-directory: selenium-tests
        run: npm install
      - name: Start backend server
        run: |
          python backend/app.py > backend.log 2>&1 &
          for i in $(seq 1 20); do
            if curl -s http://127.0.0.1:5000/api/health >/dev/null 2>&1; then exit 0; fi
            sleep 3
          done
          cat backend.log
          exit 1
      - name: Start frontend server
        working-directory: frontend
        run: |
          npm run dev -- --host 0.0.0.0 --port 5173 > ../frontend.log 2>&1 &
          for i in $(seq 1 20); do
            if curl -s http://127.0.0.1:5173 >/dev/null 2>&1; then exit 0; fi
            sleep 3
          done
          cat ../frontend.log
          exit 1
      - name: Run Selenium tests and generate report
        working-directory: selenium-tests
        run: npm test
      - name: Upload Selenium report artifact
        uses: actions/upload-artifact@v4
        with:
          name: selenium-test-report
          path: selenium-tests/test-results/selenium-test-report.xlsx

  appium-e2e:
    name: Appium E2E Report
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '20'
      - name: Install backend requirements
        run: |
          python -m pip install --upgrade pip
          if [ -f backend/requirements.txt ]; then pip install -r backend/requirements.txt; fi
      - name: Install frontend dependencies
        working-directory: frontend
        run: npm install
      - name: Install Appium dependencies
        working-directory: appium-tests
        run: npm install
      - name: Start backend server
        run: |
          python backend/app.py > backend.log 2>&1 &
          for i in $(seq 1 20); do
            if curl -s http://127.0.0.1:5000/api/health >/dev/null 2>&1; then exit 0; fi
            sleep 3
          done
          cat backend.log
          exit 1
      - name: Start frontend server
        working-directory: frontend
        run: |
          npm run dev -- --host 0.0.0.0 --port 5173 > ../frontend.log 2>&1 &
          for i in $(seq 1 20); do
            if curl -s http://127.0.0.1:5173 >/dev/null 2>&1; then exit 0; fi
            sleep 3
          done
          cat ../frontend.log
          exit 1
      - name: Start Appium server
        working-directory: appium-tests
        run: |
          npx appium --allow-insecure chromedriver_autodownload --relaxed-security > appium.log 2>&1 &
          for i in $(seq 1 20); do
            if curl -s http://127.0.0.1:4723/wd/hub/status >/dev/null 2>&1; then exit 0; fi
            sleep 3
          done
          cat appium.log
          exit 1
      - name: Run Appium tests and generate report
        working-directory: appium-tests
        run: npm test
      - name: Upload Appium report artifact
        uses: actions/upload-artifact@v4
        with:
          name: appium-test-report
          path: appium-tests/test-results/appium-test-report.xlsx

  backend-verification:
    name: Backend Verification
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install backend requirements
        run: |
          python -m pip install --upgrade pip
          if [ -f backend/requirements.txt ]; then pip install -r backend/requirements.txt; fi
      - name: Run backend verification
        run: python run_tests.py
      - name: Upload backend verification artifact
        uses: actions/upload-artifact@v4
        with:
          name: backend-verification-report
          path: test_verification_report.txt
