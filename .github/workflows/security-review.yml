name: Security Review

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  discovery-and-sast:
    name: Backend discovery and SAST
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install scan dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install openpyxl pip-audit
      - name: Generate security review reports
        run: python security_review.py
      - name: Run dependency audit
        run: python -m pip-audit --output dependency-audit.json || true
      - name: Upload security artifacts
        uses: actions/upload-artifact@v4
        with:
          name: security-review-artifacts
          path: |
            Vulnerability Test Results/security-review.md
            Vulnerability Test Results/executive-summary.md
            Vulnerability Test Results/dependency-report.md
            Vulnerability Test Results/endpoint-inventory.xlsx
            Vulnerability Test Results/findings.xlsx
            Vulnerability Test Results/dependency-vulnerabilities.xlsx
            dependency-audit.json
