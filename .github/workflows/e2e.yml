            sleep 3
          done
      - name: Run Load Testing Performance (300)
        working-directory: e2e-tests
        run: npm run test:load
      - name: Upload Load Testing Report Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Load-Testing-Performance-Report
          path: e2e-tests/test-results/Load-Testing-Performance-Report.xlsx

  compile-master-report:
    name: "📊 Compile Master Report & Deploy"
    runs-on: ubuntu-latest
    needs:
      - selenium-web-tests
      - appium-android-tests
      - unit-tests-api
      - validation-tests
      - deployment-status
      - load-testing-performance
    steps:
      - uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '20'
      - name: Install e2e-tests dependencies
        working-directory: e2e-tests
        run: npm install
      - name: Download all report artifacts
        uses: actions/download-artifact@v4
        with:
          path: e2e-tests/test-results
          merge-multiple: true
      - name: Compile Master 1800 E2E Report
        working-directory: e2e-tests
        run: npm run test:compile
      - name: Upload Master Excel Report Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Master-1800-E2E-Test-Report-Excel
          path: e2e-tests/test-results/Master-1800-E2E-Test-Report.xlsx
