      - name: Upload Deployment Status Report Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Deployment-Status-Test-Report
          path: e2e-tests/test-results/Deployment-Status-Test-Report.xlsx

  load-testing-performance:
    name: "📊 Load Testing — Performance (300)"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Set up Node.js
        uses: actions/setup-node@v5
