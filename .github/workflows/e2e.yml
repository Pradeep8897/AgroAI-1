name: Scale E2E suites to 1800 test cases with robust Selenium/Appium/API

on:
  push:
    branches:
      - main
      - 'feature/**'
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  selenium-web-tests:
    name: "🌐 Selenium — Website Tests (300)"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '20'
      - name: Install backend requirements
        run: |
          python -m pip install --upgrade pip
          if [ -f backend/requirements.txt ]; then pip install -r backend/requirements.txt; fi
      - name: Install frontend dependencies
        working-directory: frontend
        run: npm install
      - name: Install e2e-tests dependencies
        working-directory: e2e-tests
        run: npm install
      - name: Start backend server
        run: |
          python backend/app.py > backend.log 2>&1 &
          for i in $(seq 1 20); do
            if curl -s http://127.0.0.1:5000/api/health >/dev/null 2>&1; then exit 0; fi
            sleep 3
          done
      - name: Start frontend server
        working-directory: frontend
        run: |
          npm run dev -- --host 0.0.0.0 --port 5173 > ../frontend.log 2>&1 &
          for i in $(seq 1 20); do
            if curl -s http://127.0.0.1:5173 >/dev/null 2>&1; then exit 0; fi
            sleep 3
          done
      - name: Run Selenium Website Tests (300)
        working-directory: e2e-tests
        run: npm run test:selenium
      - name: Upload Selenium Report Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Selenium-Web-Test-Report
          path: e2e-tests/test-results/Selenium-Web-Test-Report.xlsx

  appium-android-tests:
    name: "📱 Appium — Android Tests (300)"
