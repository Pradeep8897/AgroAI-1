          for i in $(seq 1 20); do
            if curl -s http://127.0.0.1:5000/api/health >/dev/null 2>&1; then exit 0; fi
            sleep 3
          done
      - name: Start frontend server
        working-directory: frontend
        run: |
          npm run dev -- --host 0.0.0.0 --port 5173 > ../frontend.log 2>&1 &
          for i in $(seq 1 20); do
            if curl -s http://127.0.0.1:5173 >/dev/null 2>&1; then exit 0; fi
            sleep 3
          done
      - name: Run Appium Android Tests (300)
        working-directory: e2e-tests
        run: npm run test:appium
      - name: Upload Appium Report Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Appium-Android-Test-Report
          path: e2e-tests/test-results/Appium-Android-Test-Report.xlsx

  unit-tests-api:
    name: "🔬 Unit Tests — API (300)"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
